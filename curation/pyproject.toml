[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "malavi-curation"
version = "0.0.1"
description = "Paper-first curation helper for MalAvi: parse publications into review-ready candidate records."
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Vincenzo A. Ellis", email = "vaellis@udel.edu" }]
dependencies = [
  "pyyaml>=6.0",      # read config/project.yml
  "requests>=2.28",   # NCBI / Europe PMC / DOI lookups
  "pydantic>=2.0",    # validate candidate records against the submission schema
  # Used on the DEFAULT path (build_submission_from_path validates unless told not to),
  # so it is a real dependency. It sat under `dev` while the code imported it in normal
  # operation, which meant the scheduled job silently produced no report at all.
  "jsonschema>=4.0",  # validate against schemas/*.schema.json
]

[project.optional-dependencies]
pdf = [
  "pdfplumber>=0.10", # PDF text + table extraction (used by pdf_extract)
]
tables = [
  "openpyxl>=3.1",    # .xlsx supplementary tables (table_extract)
  "python-docx>=1.1", # .docx supplementary tables (table_extract)
]
fetch = [
  "beautifulsoup4>=4.11", # scrape publisher landing pages (fetch_oa_articles)
]
report = [
  # Renders the curator report to PDF. PDF rather than HTML because the report is
  # delivered through Google Drive, which stopped rendering HTML in 2016 and would
  # otherwise make every curator download a file instead of clicking a link.
  # Optional on purpose: without it report_html still writes the HTML, and the
  # pipeline says the PDF is missing rather than failing.
  "weasyprint>=60",
]
google = [
  # Read-only access to MalAvi's private Drive for the fetch jobs. Optional because
  # everything else in this package works offline; without it the fetchers stop with
  # an explanatory error rather than reporting an empty inbox. See GOOGLE_ACCESS.md.
  "google-auth>=2.0",
]
dev = [
  "pytest>=7.0",
  # The suite exercises release building, which writes .xlsx, so it needs the tables
  # extra whether or not a given install wants that feature at runtime. Referenced by
  # extra rather than by naming openpyxl again, so the version pin has one home.
  #
  # This was missing until 2026-08-08, and CI failed the moment it first saw
  # test_release_build.py -- which was written on 08-07 but sat in unpushed commits.
  # "dev" has to mean everything the tests need, or CI tests a different package than
  # the one developers run.
  "malavi-curation[tables]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the malaviR-derived gazetteer (genera/binomials/countries) so the host
# extractor works without R at runtime. Regenerate with curation/r/gazetteer.R.
malavi_curation = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
